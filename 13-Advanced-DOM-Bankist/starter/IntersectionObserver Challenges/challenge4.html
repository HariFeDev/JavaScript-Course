<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Challenge 4 - Scroll Spy</title>
<style>
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:sans-serif}
.side-nav{position:fixed;top:50%;right:1.5rem;transform:translateY(-50%);display:flex;flex-direction:column;gap:1rem;z-index:10}
.side-nav a{display:block;padding:.5rem 1rem;border-radius:20px;background:#fff;color:#333;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.2);transition:.3s}
.side-nav a.active{background:#6a11cb;color:#fff;transform:scale(1.1)}
section{height:100vh;display:flex;align-items:center;justify-content:center;font-size:3rem;color:#fff}
#section-1{background:#e74c3c}#section-2{background:#3498db}#section-3{background:#2ecc71}
#section-4{background:#f39c12}#section-5{background:#9b59b6}
</style></head><body>
<nav class="side-nav">
<a href="#section-1" class="nav-link">One</a><a href="#section-2" class="nav-link">Two</a>
<a href="#section-3" class="nav-link">Three</a><a href="#section-4" class="nav-link">Four</a>
<a href="#section-5" class="nav-link">Five</a>
</nav>
<section id="section-1">Section 1</section><section id="section-2">Section 2</section>
<section id="section-3">Section 3</section><section id="section-4">Section 4</section>
<section id="section-5">Section 5</section>
<script src="challenge4.js"></script></body></html>
