<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Challenge 5 - Infinite Scroll</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:sans-serif;background:#f4f4f8;padding:2rem}
.list{max-width:500px;margin:auto;list-style:none}
.list li{background:#fff;padding:1.5rem;margin-bottom:1rem;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
#sentinel{height:20px}
.status{text-align:center;padding:1rem;color:#555}
.hidden{display:none}
</style></head><body>
<ul class="list" id="list"><!-- JS adds items: "Item 1", "Item 2"... --></ul>
<div id="sentinel"></div>
<p class="status hidden" id="loading">Loading...</p>
<p class="status hidden" id="end">No more items</p>
<script src="challenge5.js"></script></body></html>
