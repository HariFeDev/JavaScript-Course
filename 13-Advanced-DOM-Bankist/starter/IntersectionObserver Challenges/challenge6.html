    <style>
      * {

      }
      body {
        font-family: sans-serif;

        padding: 2rem;
        display: flex;
        gap: 2rem;
        justify-content: center;
        align-items: flex-start;
      }
      .wrapper {
        position: relative;
        width: 320px;
      }
      /* the scrollable box = your custom ROOT */
      .scroll-box {
        height: 320px;
        overflow-y: auto;
        border: 3px solid #333;
        border-radius: 10px;
        background: #fff;
        padding: 10px;
      }
      /* dashed band = where the item should count as "visible" (50px inset top & bottom) */
      .zone {
        position: absolute;
        top: 53px;
        bottom: 53px;
        left: 3px;
        right: 3px;
        border-top: 2px dashed #e74c3c;
        border-bottom: 2px dashed #e74c3c;
        pointer-events: none;
      }
      .item {
        height: 120px;
        margin-bottom: 15px;
        border-radius: 8px;
        background: #ccc;
        color: #333;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.3rem;
        transition:
          background 0.3s,
          color 0.3s;
      }
      .item.active {
        background: #2ecc71;
        color: #fff;
      }
      .info {
        width: 260px;
        background: #fff;
        padding: 1rem;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .info h3 {
        margin-bottom: 0.5rem;
      }
      #info p {
        margin: 0.4rem 0;
        font-size: 0.95rem;
      }
    </style>
  </head>
